<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AlphaSim v9</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<style>
:root{
  --bg:#080a0d; --panel:#0f1318; --panel2:#141a21; --line:#1f2730; --line2:#2a343f;
  --ink:#dde4ec; --mut:#7c8896; --dim:#525d69;
  --long:#3fd07a; --short:#ff6b6b; --bench:#5bc8ff; --amber:#f5b544; --combo:#c9d3df;
  --good:#3fd07a; --bad:#ff6b6b; --warn:#f5b544;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Archivo",sans-serif;-webkit-font-smoothing:antialiased}
body{padding:0 0 60px}
.mono{font-family:"JetBrains Mono",monospace}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.banner{background:repeating-linear-gradient(135deg,#1a1206,#1a1206 10px,#1d1407 10px,#1d1407 20px);border-bottom:1px solid #3a2c0e;color:var(--amber);font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding:6px 10px;font-weight:600}
header.top{border-bottom:1px solid var(--line);padding:16px 0 14px;position:sticky;top:0;background:rgba(8,10,13,.92);backdrop-filter:blur(8px);z-index:20}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-size:21px;font-weight:800;letter-spacing:.04em}
.brand .v{color:var(--dim);font-size:12px}
.brand .tag{color:var(--mut);font-size:12px;margin-left:auto;font-weight:500}
.statusrow{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;padding:4px 9px;border-radius:3px;border:1px solid var(--line2);text-transform:uppercase}
.pill.live{color:var(--good);border-color:#1d4d33;background:#0c1a12}
.pill.demo{color:var(--amber);border-color:#3a2c0e;background:#161005}
.pill.error{color:var(--bad);border-color:#4d1d1d;background:#1a0c0c}
.pill.ghost{color:var(--mut)}
.clk{margin-left:auto;color:var(--mut);font-size:12px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
input.key{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:7px 10px;border-radius:4px;font-family:"JetBrains Mono",monospace;font-size:12px;min-width:230px}
button.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--ink);padding:7px 12px;border-radius:4px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s;font-family:"Archivo",sans-serif}
button.btn:hover{border-color:#3a4654;background:#1a222b}
button.btn:disabled{opacity:.4;cursor:not-allowed}
button.btn.go{border-color:#1d4d33;color:var(--good)}
button.btn.warn{border-color:#4d1d1d;color:var(--bad)}
button.btn.on{background:#0c1a12;border-color:#1d4d33;color:var(--good)}
.section{margin-top:22px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px 14px}
.card .lab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:600}
.card .big{font-size:22px;font-weight:700;margin-top:6px}
.card .sub{font-size:12px;margin-top:3px;color:var(--mut)}
.pos{color:var(--good)} .neg{color:var(--bad)} .neu{color:var(--mut)}
.crit{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-top:12px}
.dataerr{background:#1a0c0c;border:1px solid #4d1d1d;color:#ffb3b3;border-radius:6px;padding:13px 16px;margin-top:16px;font-size:13px;line-height:1.5}
.keystat{display:inline-flex;align-items:center;padding:0 2px}
.tabs button.haserr{color:var(--bad)}
.dataerr strong{color:var(--bad);letter-spacing:.04em}
.crit h3{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:10px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#2a6cff,#5bc8ff)}
.critgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.critgrid .k{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.critgrid .vv{font-size:16px;font-weight:700;margin-top:4px}
.health{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}
.hc{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:10px}
.hc .hl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
.hc .hv{font-size:13px;font-weight:600;margin-top:4px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
.dot.g{background:var(--good)} .dot.a{background:var(--amber)} .dot.r{background:var(--bad)} .dot.d{background:var(--dim)}
.panelbox{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-top:12px}
.pb-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pb-head h3{font-size:13px;font-weight:700;letter-spacing:.02em}
.chartbtns{display:flex;gap:5px;margin-left:auto;flex-wrap:wrap}
.chartbtns button{background:transparent;border:1px solid var(--line2);color:var(--mut);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;font-weight:600;letter-spacing:.05em}
.chartbtns button.sel{color:var(--ink);border-color:#3a4654;background:var(--panel2)}
.chartwrap{padding:14px 8px 6px}
.legend{display:flex;gap:16px;padding:0 16px 12px;flex-wrap:wrap;font-size:11px;color:var(--mut)}
.legend i{display:inline-block;width:11px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tabs button{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--mut);padding:9px 14px;font-size:13px;font-weight:600;cursor:pointer;font-family:"Archivo",sans-serif}
.tabs button.sel{color:var(--ink);border-bottom-color:var(--bench)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:right;color:var(--mut);font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{padding:8px 10px;border-bottom:1px solid var(--line);font-family:"JetBrains Mono",monospace}
tr:last-child td{border-bottom:none}
.tag2{font-size:9px;padding:2px 6px;border-radius:3px;border:1px solid var(--line2);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-family:"Archivo",sans-serif;font-weight:600}
.tag2.long{color:var(--long);border-color:#1d4d33}
.tag2.short{color:var(--short);border-color:#4d1d1d}
.tag2.live{color:var(--good);border-color:#1d4d33}
.tag2.mock{color:var(--amber);border-color:#3a2c0e}
.tag2.mixed{color:var(--bench);border-color:#1d3a4d}
.emptymsg{padding:26px 16px;text-align:center;color:var(--dim);font-size:13px}
.sess{border:1px solid var(--line);border-radius:5px;margin-top:8px;overflow:hidden}
.sess>summary{padding:10px 14px;cursor:pointer;list-style:none;display:flex;gap:14px;align-items:center;font-size:12px;font-family:"JetBrains Mono",monospace}
.sess>summary::-webkit-details-marker{display:none}
.sess>summary:hover{background:var(--panel2)}
.weightrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.wcell{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:10px}
.wcell .wl{font-size:10px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em}
.wcell .wv{font-size:17px;font-weight:700;margin-top:5px;font-family:"JetBrains Mono",monospace}
.wcell .wd{font-size:11px;margin-top:3px}
.heat{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hcell{padding:7px 10px;border-radius:4px;border:1px solid var(--line);font-size:11px;font-family:"JetBrains Mono",monospace}
.note{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.5}
.adaptlog{font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.6;color:var(--mut)}
.adaptlog .ap{color:var(--good)} .adaptlog .rj{color:var(--bad)}
.actlog{font-family:"JetBrains Mono",monospace;font-size:11px;line-height:1.7;color:var(--mut);max-height:280px;overflow:auto;padding:12px 16px}
.sub-block{padding:10px 14px 14px;background:var(--bg)}
h4.mini{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.1em;font-weight:600;margin:16px 0 6px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.critgrid{grid-template-columns:1fr}.health{grid-template-columns:repeat(3,1fr)}.weightrow{grid-template-columns:repeat(3,1fr)}}
</style>

<body>
<div id="root"></div>
<script>
"use strict";
/* ==========================================================================
   AlphaSim v9 — single-file build (React via CDN, createElement, no JSX,
   no template literals). Sections:
     0. polyGet proxy queue (4 calls/min)
     1. DATA LAYER MODULE (pasted verbatim; only §10 weight renorm applied)
     2. mock/demo fallback (honesty instrument)
     3. sim engine (init/refresh/close/new-day, realistic costs)
     4. benchmark + dataSource quarantine
     5. learning engine (batch / OOS / benchmark-gated)
     6. React UI
   ========================================================================== */

/* ---------- shared constants ---------- */
var LS_MAIN  = "alphasim_v9";
var LS_TRADE = "alphasim_v9_t";
var LS_KEY   = "alphasim_v9_key";
var LS_LEARN = "alphasim_v9_learn";
var LS_BENCH = "alphasim_v9_bench";
var FEE_RT = 0.10;            /* % round-trip fee on every exit */
var BASE_CAP = 1000;         /* notional scorekeeping base per sim */
var REFRESH_MS = 30000;      /* stop/target monitoring cadence (30s). Entry-window
                                re-scoring stays on the 09:30/10:30/12:00/14:00/15:30
                                schedule below; only position checks run this often. */

/* success criterion (stored + displayed) */
var CRIT = { sessions: 60, regimes: 2 };

/* ============================================================================
   0. polyGet — routes via /api/proxy, appends apiKey, 4-calls/min queue
   ============================================================================ */
var API = { polygon: "none", finnhub: "none" };  /* none | unknown | ok | error */
function provStatus(p) { return API[p]; }
function logErr(kind, msg) {
  try {
    if (!STATE || !STATE.errors) return;
    var et = etParts();
    STATE.errors.unshift({ time: (STATE.sessionDate || et.date) + " " + pad2(et.h) + ":" + pad2(et.m) + " ET", kind: kind, message: msg });
    if (STATE.errors.length > 200) STATE.errors = STATE.errors.slice(0, 200);
  } catch (e) {}
}
var Q = [];
var Q_BUSY = false;
var Q_LAST = 0;
var Q_GAP = 15000;                      /* >=15s between calls = 4/min */

function unquote(v) {
  if (!v) return "";
  if (v.length >= 2 && v.charAt(0) === "\"" && v.charAt(v.length - 1) === "\"") { try { v = JSON.parse(v); } catch (e) { v = v.slice(1, -1); } }
  return ("" + v).trim();
}
function currentKey() { try { return unquote(window.localStorage.getItem(LS_KEY)); } catch (e) { return ""; } }

function polyGet(path) {
  return new Promise(function (resolve) {
    if (!currentKey()) { API.polygon = "none"; resolve(null); return; }
    Q.push({ path: path, resolve: resolve });
    pumpQueue();
  });
}
function pumpQueue() {
  if (Q_BUSY || Q.length === 0) return;
  Q_BUSY = true;
  var job = Q.shift();
  var wait = Math.max(0, Q_GAP - (Date.now() - Q_LAST));
  setTimeout(function () {
    Q_LAST = Date.now();
    var key = currentKey();
    var sep = job.path.indexOf("?") !== -1 ? "&" : "?";
    var endpoint = job.path + sep + "apiKey=" + key;
    var url = "/api/proxy?endpoint=" + encodeURIComponent(endpoint);
    fetch(url).then(function (r) {
      if (r.status === 403 || r.status === 401) {
        API.polygon = "error";
        logErr("Polygon", "Request rejected (HTTP " + r.status + ") \u2014 key not accepted or endpoint not in plan: " + job.path);
        return null;
      }
      return r.json();
    }).then(function (j) {
      if (j && j.status && (j.status === "ERROR" || j.status === "NOT_AUTHORIZED")) {
        API.polygon = "error";
        logErr("Polygon", (j.message || j.status) + " \u2014 " + job.path);
      } else if (API.polygon !== "error") { API.polygon = "ok"; }
      job.resolve(j);
    }).catch(function () {
      API.polygon = "error";
      logErr("Polygon", "Network/proxy failure reaching /api/proxy for: " + job.path);
      job.resolve(null);
    }).then(function () {
      Q_BUSY = false;
      pumpQueue();
    });
  }, wait);
}

/* ============================================================================
   1. DATA LAYER MODULE — pasted from alphasim_datalayer.js (validated).
      ONLY change vs source: WEIGHTS_A / WEIGHTS_B renormalised per §10
      (News set to a neutral constant, remaining five summed to 1.0; the news
      hook is retained in scoreWatchlist at weight 0 for a future sentiment
      source). Everything else is verbatim.
   ============================================================================ */
var LS_DAILY    = "alphasim_v9_daily";
var LS_UNIVERSE = "alphasim_v9_universe";
var LS_SECTORS  = "alphasim_v9_sectors";

var CFG = {
  HISTORY_DAYS: 21,
  UNIVERSE_MAX: 500,
  MIN_PRICE: 5,
  MAX_PRICE: 800,
  MIN_DOLLAR_VOL: 20e6,
  WATCHLIST_N: 20,
  SECTOR_BACKFILL_PER_RUN: 3
};

/* §10 renormalised baselines (news hook retained at 0.0) */
var WEIGHTS_A = { rvol:0.318, gap:0.259, rsi:0.153, atr:0.153, vwap:0.118, news:0.0 };
var WEIGHTS_B = { rvol:0.217, gap:0.120, rsi:0.181, atr:0.181, vwap:0.301, news:0.0 };

function lsGet(key, fallback) {
  try {
    var raw = window.localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function lsSet(key, obj) {
  try { window.localStorage.setItem(key, JSON.stringify(obj)); return true; }
  catch (e) { console.warn("lsSet failed for " + key + ": " + e.message); return false; }
}

function isoDate(d) {
  var y = d.getUTCFullYear();
  var m = d.getUTCMonth() + 1;
  var day = d.getUTCDate();
  return y + "-" + (m < 10 ? "0" + m : "" + m) + "-" + (day < 10 ? "0" + day : "" + day);
}
function prevDay(dateStr) {
  var parts = dateStr.split("-");
  var d = new Date(Date.UTC(+parts[0], +parts[1] - 1, +parts[2]));
  d.setUTCDate(d.getUTCDate() - 1);
  return isoDate(d);
}
function okResults(resp) { return resp && resp.results && resp.results.length > 0; }

function groupedPath(dateStr) {
  return "/v2/aggs/grouped/locale/us/market/stocks/" + dateStr + "?adjusted=true";
}
async function fetchMostRecentGrouped(seedDateStr, maxBack) {
  var date = seedDateStr;
  var tries = 0;
  while (tries < maxBack) {
    var resp = await polyGet(groupedPath(date));
    if (okResults(resp)) return { date: date, results: resp.results };
    date = prevDay(date);
    tries = tries + 1;
  }
  return null;
}

async function refreshDailyCache(todayStr) {
  var cache = lsGet(LS_DAILY, { updated: null, days: [], stats: {} });
  var grouped = await fetchMostRecentGrouped(prevDay(todayStr), 7);
  if (!grouped) { console.warn("refreshDailyCache: no grouped data found"); return cache; }
  if (cache.days.indexOf(grouped.date) !== -1) return cache;

  var universe = buildUniverse(grouped.results);
  lsSet(LS_UNIVERSE, { built: grouped.date, tickers: universe });
  var inUniverse = {};
  for (var u = 0; u < universe.length; u++) inUniverse[universe[u]] = true;

  var stats = cache.stats;
  for (var i = 0; i < grouped.results.length; i++) {
    var r = grouped.results[i];
    if (!inUniverse[r.T]) continue;
    var s = stats[r.T] || { c: [], h: [], l: [], v: [] };
    s.c.push(r.c); s.h.push(r.h); s.l.push(r.l); s.v.push(r.v);
    if (s.c.length > CFG.HISTORY_DAYS) {
      s.c = s.c.slice(-CFG.HISTORY_DAYS);
      s.h = s.h.slice(-CFG.HISTORY_DAYS);
      s.l = s.l.slice(-CFG.HISTORY_DAYS);
      s.v = s.v.slice(-CFG.HISTORY_DAYS);
    }
    stats[r.T] = s;
  }
  for (var t in stats) { if (stats.hasOwnProperty(t) && !inUniverse[t]) delete stats[t]; }

  cache.days.push(grouped.date);
  if (cache.days.length > CFG.HISTORY_DAYS) cache.days = cache.days.slice(-CFG.HISTORY_DAYS);
  cache.stats = stats;
  cache.updated = grouped.date;
  lsSet(LS_DAILY, cache);
  return cache;
}

/* First-run backfill: walk back up to wantDays trading days in one warm-up so
   SPY has >=2 closes and ATR/RSI have enough history immediately, instead of
   accruing one day per calendar day. One grouped call per day (whole market). */
async function backfillHistory(todayStr, wantDays) {
  var collected = [];                 /* newest first */
  var seed = prevDay(todayStr);
  for (var i = 0; i < wantDays; i++) {
    var g = await fetchMostRecentGrouped(seed, 7);
    if (!g) break;
    collected.push(g);
    if (typeof logAct === "function") logAct("Warm-up: loaded " + g.date + " (" + collected.length + "/" + wantDays + ").");
    if (typeof bump === "function") bump();
    seed = prevDay(g.date);
  }
  if (collected.length === 0) return null;
  var universe = buildUniverse(collected[0].results);   /* newest day defines universe */
  lsSet(LS_UNIVERSE, { built: collected[0].date, tickers: universe });
  var inU = {};
  for (var u = 0; u < universe.length; u++) inU[universe[u]] = true;
  var ordered = collected.slice().reverse();            /* oldest -> newest */
  var stats = {};
  var days = [];
  for (var d = 0; d < ordered.length; d++) {
    days.push(ordered[d].date);
    var res = ordered[d].results;
    for (var k = 0; k < res.length; k++) {
      var r = res[k];
      if (!inU[r.T]) continue;
      var s = stats[r.T] || { c: [], h: [], l: [], v: [] };
      s.c.push(r.c); s.h.push(r.h); s.l.push(r.l); s.v.push(r.v);
      stats[r.T] = s;
    }
  }
  var cache = { updated: ordered[ordered.length - 1].date, days: days.slice(-CFG.HISTORY_DAYS), stats: stats };
  lsSet(LS_DAILY, cache);
  return cache;
}

/* Use a one-time backfill when the cache is thin, else the cheap 1-day append. */
async function ensureDailyCache(todayStr) {
  var cache = lsGet(LS_DAILY, { days: [] });
  if (!cache.days || cache.days.length < 2) {
    if (typeof logAct === "function") logAct("First run: warming up history (one grouped call per day; ~5 min on the free tier).");
    return await backfillHistory(todayStr, CFG.HISTORY_DAYS);
  }
  return await refreshDailyCache(todayStr);
}

function buildUniverse(results) {
  var scored = [];
  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    if (r.otc) continue;
    if (typeof r.c !== "number" || typeof r.v !== "number") continue;
    if (r.c < CFG.MIN_PRICE || r.c > CFG.MAX_PRICE) continue;
    if (r.T.indexOf(".") !== -1 || r.T.length > 5) continue;
    var dollarVol = r.c * r.v;
    if (dollarVol < CFG.MIN_DOLLAR_VOL) continue;
    scored.push({ T: r.T, dv: dollarVol });
  }
  scored.sort(function (a, b) { return b.dv - a.dv; });
  var out = [];
  var lim = Math.min(scored.length, CFG.UNIVERSE_MAX);
  for (var k = 0; k < lim; k++) out.push(scored[k].T);
  return out;
}

function atrPctFromArrays(s) {
  var n = s.c.length;
  if (n < 2) return 0;
  var trs = [];
  for (var i = 1; i < n; i++) {
    var prevClose = s.c[i - 1];
    var tr = Math.max(s.h[i] - s.l[i], Math.abs(s.h[i] - prevClose), Math.abs(s.l[i] - prevClose));
    trs.push(tr);
  }
  var win = trs.slice(-14);
  var sum = 0;
  for (var j = 0; j < win.length; j++) sum = sum + win[j];
  var atr = win.length ? sum / win.length : 0;
  var last = s.c[n - 1];
  return last ? (atr / last) * 100 : 0;
}
function rsi14FromCloses(closes) {
  var n = closes.length;
  if (n < 15) return 50;
  var win = closes.slice(-15);
  var gain = 0, loss = 0;
  for (var i = 1; i < win.length; i++) {
    var ch = win[i] - win[i - 1];
    if (ch >= 0) gain = gain + ch; else loss = loss - ch;
  }
  var avgG = gain / 14, avgL = loss / 14;
  if (avgL === 0) return 100;
  var rs = avgG / avgL;
  return 100 - (100 / (1 + rs));
}
function avgVol(s) {
  var n = s.v.length;
  if (!n) return 0;
  var sum = 0;
  for (var i = 0; i < n; i++) sum = sum + s.v[i];
  return sum / n;
}

function buildWatchlist(side) {
  var cache = lsGet(LS_DAILY, { stats: {} });
  var rows = [];
  for (var t in cache.stats) {
    if (!cache.stats.hasOwnProperty(t)) continue;
    var s = cache.stats[t];
    if (s.c.length < 6) continue;
    var atrp = atrPctFromArrays(s);
    var last = s.c[s.c.length - 1];
    var ref = s.c.length >= 6 ? s.c[s.c.length - 6] : s.c[0];
    var mom5 = ref ? ((last - ref) / ref) * 100 : 0;
    var liq = avgVol(s) * last;
    var dir = side === "short" ? -1 : 1;
    var score = (atrp * 1.0) + (dir * mom5 * 0.6) + (Math.log10(liq) * 0.5);
    rows.push({ T: t, score: score, atrp: atrp });

  for (var i = 0; i < Math.min(rows.length, CFG.WATCHLIST_N); i++) out.push(rows[i].T);

    var sym = symbols[i];

    var q = await liveQuote(sym);
    if (!q || !q.price) continue;
    var gapPct = q.prevClose ? ((q.open - q.prevClose) / q.prevClose) * 100 : 0;
    var rvol = avgVol(s) ? (q.todayVol / avgVol(s)) : 0;
    var rsi = rsi14FromCloses(s.c);

}

function getStopPct(atrp) { if (atrp > 4) return 1.8; if (atrp > 3) return 2.0; if (atrp > 2) return 2.2; return 2.5; }

async function refreshPositions(symbols) {

function detailsPath(ticker) { return "/v3/reference/tickers/" + ticker; }

  if (n >= 1000 && n <= 1499) return "Materials";
  if (n >= 1500 && n <= 1799) return "Industrials";
  if (n >= 2000 && n <= 2199) return "Consumer";
  if (n >= 2800 && n <= 2899) return "Materials";
  if (n >= 2830 && n <= 2836) return "Healthcare";
  if (n >= 2900 && n <= 2999) return "Energy";
  if (n >= 3570 && n <= 3579) return "Technology";

var _pendingSector = {};

/* ============================================================================
   1b. FINNHUB LIVE-QUOTE LAYER (§14 hardening)
       Polygon's free tier is end-of-day only, so its intraday snapshot returns
       NOT_AUTHORIZED on a free key. Finnhub's free tier (60 calls/min) does
       serve real-time US quotes, so we use it for the live price + gap when a
       Finnhub key is present. Polygon still does the once-daily whole-market
       grouped call (universe + history). The module's liveQuote is reassigned
       below so scoreWatchlist / refreshPositions pick this up transparently.

       Caveat: Finnhub's free /quote returns price/open/high/low/prev-close but
       NO intraday volume or VWAP. So with Finnhub:
         - gap, RSI (daily), ATR (daily) are sound
         - VWAP proxied as "price vs session open" (up-on-day)
         - RVOL has no free live source -> neutralised (flagged in UI)
       A paid Polygon tier restores volume/VWAP; in that case leave the Finnhub
       key blank and the original snapshot path is used.
   ============================================================================ */
var LS_FHKEY = "alphasim_v9_fhkey";
function finnhubKey() { try { return unquote(window.localStorage.getItem(LS_FHKEY)); } catch (e) { return ""; } }

/* Finnhub has its own queue (~55/min) routed via the shared proxy host param */
var FQ = [], FQ_BUSY = false, FQ_LAST = 0, FQ_GAP = 1100;
function fhGet(path) {
  return new Promise(function (resolve) {
    if (!finnhubKey()) { API.finnhub = "none"; resolve(null); return; }
    FQ.push({ path: path, resolve: resolve });

  });
}
function pumpFh() {
  if (FQ_BUSY || FQ.length === 0) return;

  var wait = Math.max(0, FQ_GAP - (Date.now() - FQ_LAST));
  setTimeout(function () {
    FQ_LAST = Date.now();
    var sep = job.path.indexOf("?") !== -1 ? "&" : "?";
    var endpoint = job.path + sep + "token=" + finnhubKey();
    var url = "/api/proxy?provider=finnhub&endpoint=" + encodeURIComponent(endpoint);
    fetch(url).then(function (r) {
      if (r.status === 403 || r.status === 401) {
        API.finnhub = "error";
        logErr("Finnhub", "Request rejected (HTTP " + r.status + ") \u2014 token not accepted: " + job.path);
        return null;
      }
      return r.json();

      .then(function (j) { job.resolve(j); })
      .catch(function () { API.finnhub = "error"; logErr("Finnhub", "Network/proxy failure for: " + job.path); job.resolve(null); })
      .then(function () { FQ_BUSY = false; pumpFh(); });

  if (!r || typeof r.c !== "number" || r.c === 0) return null;
  var cache = lsGet(LS_DAILY, { stats: {} });
  var s = cache.stats ? cache.stats[ticker] : null;
  var volProxy = s ? avgVol(s) : 0;          /* -> rvol approx 1 (neutral) */

  if (API.finnhub !== "error") API.finnhub = "ok";

/* ---- ET time ---- */
function pad2(n) { return n < 10 ? "0" + n : "" + n; }
function etParts() {
  var fmt = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour12: false, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", weekday: "short" });
  var parts = fmt.formatToParts(new Date());

  var h = parseInt(o.hour, 10); if (h === 24) h = 0;
  var m = parseInt(o.minute, 10);

}

/* ---- cost model (§7) ---- */

function regimeFromRet(r) { if (r <= -0.3) return "bearish"; if (r >= 0.3) return "bullish"; return "neutral"; }

/* Sim B deployment is not specified in the brief; inferred as the inverse of

function deployB(reg) { if (reg === "bearish") return 0.95; if (reg === "bullish") return 0.65; return 0.80; }

/* read SPY daily close-to-close return from the cached grouped data */
function spyReturnFromCache() {
  var cache = lsGet(LS_DAILY, { stats: {} });
  var s = cache.stats ? cache.stats["SPY"] : null;
  if (!s || s.c.length < 2) return null;
  var a = s.c[s.c.length - 2], b = s.c[s.c.length - 1];
  if (!a) return null;
  return ((b - a) / a) * 100;

/* ---- screening wrapper (live data only; never fabricates) ---- */
async function screen(side, slots, heldSymbols, heldSectors, regime) {
  var wl = buildWatchlist(side === "short" ? "short" : "long");
  var scored = await scoreWatchlist(wl, side);
  if (!scored || scored.length === 0) {
    /* no live quotes -> open nothing this window rather than invent picks */
    var sidel = side === "short" ? "B" : "A";
    logAct("Sim " + sidel + ": no live quotes available, no positions opened.");
    logErr("Scan", "Sim " + sidel + " scan returned no tradeable names at " + etStamp() + " ET (no live quotes from the price feed). No positions opened.");
    return [];
  }
  /* Sim A market-direction gate: in a bearish tape, only stocks bucking it */
  if (side !== "short" && regime === "bearish") {
    scored = scored.filter(function (x) { return x.sub && x.sub.gap > 0; });
  }
  /* avoid sectors / symbols already held this session */
  scored = scored.filter(function (x) {
    if (heldSymbols.indexOf(x.symbol) !== -1) return false;
    if (heldSectors.indexOf(x.sector) !== -1) return false;
    return true;

  for (var j = 0; j < picks.length; j++) {
    var src = bySym[picks[j].symbol];

  }

  return { syms: syms, secs: secs };

/* deploy free budget across picks, conviction-weighted */
function deployInto(sim, side, picks, deployFrac, capital, regime, windowMin) {
  var invested = 0;
  for (var i = 0; i < sim.positions.length; i++) invested += sim.positions[i].alloc;
  var budget = Math.max(0, deployFrac * capital - invested);
  if (budget <= 0 || picks.length === 0) return 0;
  var sumC = 0;
  for (var j = 0; j < picks.length; j++) sumC += Math.max(picks[j].composite, 0.0001);
  var added = 0;
  for (var k = 0; k < picks.length; k++) {
    var p = picks[k];
    var alloc = budget * (Math.max(p.composite, 0.0001) / sumC);
    sim.positions.push({
      side: side, symbol: p.symbol, sector: p.sector, entry: p.entry, mark: p.entry,
      alloc: alloc, stopPct: p.stopPct, targetPct: p.targetPct, composite: p.composite,
      atrp: p.atrp || 0, sub: p.sub || null, entryWindow: windowMin, entryTime: etStamp(),

        (!haveUniverse ? "The daily universe did not build (no Polygon grouped data). " : "") +

  } finally { _busy = false; }
}

/* ---- intraday refresh + stop/target evaluation ---- */
/* returns a live price, or null if no live quote was available (a quote miss).
   Never fabricates a price — a missed quote leaves the position on its last
   known mark and flags the session as having a data gap. */
async function getMark(sym) {
  var q = await liveQuote(sym);
  if (q && q.price) { STATE.liveQuotes++; return q.price; }
  STATE.mockQuotes++;   /* reused as the quote-miss counter for the session */
  return null;
}

function evalPosition(pos, mark) {
  /* returns null if still open, else { exit, retPct, reason } */
  var slip = slipPct(pos.atrp);
  if (pos.side === "long") {
    var stopLvl = pos.entry * (1 - pos.stopPct / 100);
    var tgtLvl = pos.entry * (1 + pos.targetPct / 100);
    if (mark <= stopLvl) {                       /* stop first (priority) */
      var fill = Math.min(stopLvl, mark);         /* gap through */
      var lossFromFill = ((pos.entry - fill) / pos.entry) * 100;
      return { exit: fill, retPct: -(lossFromFill + slip + FEE_RT), reason: "stop" };
    }
    if (mark >= tgtLvl) return { exit: tgtLvl, retPct: pos.targetPct - FEE_RT, reason: "target" };
    return null;
  } else {
    var stopLvlS = pos.entry * (1 + pos.stopPct / 100);
    var tgtLvlS = pos.entry * (1 - pos.targetPct / 100);
    if (mark >= stopLvlS) {
      var fillS = Math.max(stopLvlS, mark);
      var lossS = ((fillS - pos.entry) / pos.entry) * 100;
      return { exit: fillS, retPct: -(lossS + slip + FEE_RT), reason: "stop" };
    }
    if (mark <= tgtLvlS) return { exit: tgtLvlS, retPct: pos.targetPct - FEE_RT, reason: "target" };
    return null;
  }
}

function closePosition(sim, idx, exit, retPct, reason) {
  var pos = sim.positions[idx];
  var pnl = pos.alloc * (retPct / 100);
  var rec = {
    side: pos.side, symbol: pos.symbol, sector: pos.sector, entry: pos.entry, exit: exit,
    alloc: pos.alloc, retPct: retPct, pnl: pnl, reason: reason, entryWindow: pos.entryWindow,
    entryTime: pos.entryTime, exitTime: etStamp(), atrp: pos.atrp, sub: pos.sub,
    regime: pos.regime, dataSource: pos.dataSource, date: STATE.sessionDate
  };
  sim.closed.push(rec);
  if (pos.side === "long") STATE.capitalA += pnl; else STATE.capitalB += pnl;
  appendTrade(rec);
  sim.positions.splice(idx, 1);
}

async function doRefresh(manual) {
  if (_busy) return; _busy = true;
  try {
    STATE.lastRefresh = Date.now();
    var all = STATE.simA.positions.concat(STATE.simB.positions);
    var misses = 0;
    for (var i = 0; i < all.length; i++) { var mk = await getMark(all[i].symbol); if (mk != null) all[i].mark = mk; else misses++; }
    if (misses > 0) logErr("Quote miss", "Failed to get live prices for " + misses + " of " + all.length + " open position(s) at " + etStamp() + " ET. Positions held on last known price; session flagged partial.");
    /* evaluate (iterate backwards for safe splice) */
    for (var a = STATE.simA.positions.length - 1; a >= 0; a--) {
      var pa = STATE.simA.positions[a];
      var ra = evalPosition(pa, pa.mark);
      if (ra) closePosition(STATE.simA, a, ra.exit, ra.retPct, ra.reason);
    }
    for (var b = STATE.simB.positions.length - 1; b >= 0; b--) {
      var pb = STATE.simB.positions[b];
      var rb = evalPosition(pb, pb.mark);
      if (rb) closePosition(STATE.simB, b, rb.exit, rb.retPct, rb.reason);
    }
    bump();
  } finally { _busy = false; }
}

/* ---- close day ---- */
async function doCloseDay(manual) {
  if (_busy) return; _busy = true;
  try {
    /* mark + close everything at last price (EOD, fee only) */
    var refresh = STATE.simA.positions.concat(STATE.simB.positions);
    for (var i = 0; i < refresh.length; i++) { var mk = await getMark(refresh[i].symbol); if (mk != null) refresh[i].mark = mk; }
    for (var a = STATE.simA.positions.length - 1; a >= 0; a--) {
      var pa = STATE.simA.positions[a];
      var rA = ((pa.mark - pa.entry) / pa.entry) * 100 - FEE_RT;
      closePosition(STATE.simA, a, pa.mark, rA, "eod");
    }
    for (var b = STATE.simB.positions.length - 1; b >= 0; b--) {
      var pb = STATE.simB.positions[b];
      var rB = ((pb.entry - pb.mark) / pb.entry) * 100 - FEE_RT;
      closePosition(STATE.simB, b, pb.mark, rB, "eod");
    }

    /* dataSource is "live" only if every quote this session succeeded; any
       miss makes it "partial" and quarantines it from learning. Never "mock". */
    var ds = STATE.mockQuotes > 0 ? "partial" : "live";

    var bench = lsGet(LS_BENCH, { base: BASE_CAP, value: BASE_CAP, history: [] });
    var sess = {
      date: STATE.sessionDate, regime: STATE.regime, spyRet: STATE.spyRetToday, dataSource: ds,
      startA: STATE.startA, endA: STATE.capitalA, startB: STATE.startB, endB: STATE.capitalB,
      combined: (STATE.capitalA + STATE.capitalB) / 2, bench: bench.value,

    STATE.marketOpen = false;
    STATE.simA.active = false; STATE.simB.active = false;
    logAct("Closed day. A " + fmtMoney(STATE.capitalA) + " | B " + fmtMoney(STATE.capitalB) + " | data " + ds + ".");

    runLearning();
    bump();
  } finally { _busy = false; }
}

/* ---- benchmark ---- */

/* ============================================================================
   5. LEARNING ENGINE — batch / out-of-sample / benchmark-gated (§8)
   ============================================================================ */
function liveTrades() {
  var all = lsGet(LS_TRADE, []);
  var sess = STATE.sessions || [];
  var badDate = {};
  for (var i = 0; i < sess.length; i++) { if (sess[i].dataSource !== "live") badDate[sess[i].date] = true; }
  return all.filter(function (t) { return t.dataSource === "live" && !badDate[t.date]; });
}
function sideOf(t) { return t.side === "short" ? "short" : "long"; }
var INDS = ["rvol", "gap", "rsi", "atr", "vwap"];

function meanSub(trades, ind, winners) {
  var sum = 0, n = 0;
  for (var i = 0; i < trades.length; i++) {
    var t = trades[i];
    if (!t.sub) continue;
    var isWin = t.pnl > 0;
    if (isWin !== winners) continue;
    sum += t.sub[ind]; n++;

  return n ? sum / n : 0;
}
function corr(xs, ys) {
  var n = xs.length; if (n < 3) return 0;
  var mx = 0, my = 0;
  for (var i = 0; i < n; i++) { mx += xs[i]; my += ys[i]; }
  mx /= n; my /= n;
  var sxy = 0, sx = 0, sy = 0;
  for (var j = 0; j < n; j++) { var dx = xs[j]-mx, dy = ys[j]-my; sxy += dx*dy; sx += dx*dx; sy += dy*dy; }
  if (sx === 0 || sy === 0) return 0;
  return sxy / Math.sqrt(sx*sy);
}

function computeAnalysis() {
  var lt = liveTrades();
  var byInd = {};
  for (var k = 0; k < INDS.length; k++) byInd[INDS[k]] = meanSub(lt, INDS[k], true) - meanSub(lt, INDS[k], false);

  var sec = {};
  for (var i = 0; i < lt.length; i++) {
    var s = lt[i].sector || "UNK";
    if (!sec[s]) sec[s] = { w: 0, n: 0 };
    sec[s].n++; if (lt[i].pnl > 0) sec[s].w++;
  }
  var atrBuckets = { "<2": z(), "2-3": z(), "3-4": z(), ">4": z() };
  function z() { return { w: 0, n: 0, ret: 0 }; }
  for (var a = 0; a < lt.length; a++) {
    var ap = lt[a].atrp || 0, key = ap > 4 ? ">4" : ap > 3 ? "3-4" : ap > 2 ? "2-3" : "<2";
    atrBuckets[key].n++; atrBuckets[key].ret += lt[a].retPct; if (lt[a].pnl > 0) atrBuckets[key].w++;
  }
  var reg = {};
  for (var r = 0; r < lt.length; r++) { var g = lt[r].regime || "?"; if (!reg[g]) reg[g] = { w: 0, n: 0 }; reg[g].n++; if (lt[r].pnl > 0) reg[g].w++; }
  var tod = {};
  for (var w2 = 0; w2 < lt.length; w2++) { var win = minLabel(lt[w2].entryWindow); if (!tod[win]) tod[win] = { w: 0, n: 0 }; tod[win].n++; if (lt[w2].pnl > 0) tod[win].w++; }
  var lA = lt.filter(function (t) { return t.side === "long"; });
  var lB = lt.filter(function (t) { return t.side === "short"; });
  var cmp = { aN: lA.length, aWin: winRate(lA), aRet: avgRet(lA), bN: lB.length, bWin: winRate(lB), bRet: avgRet(lB) };
  return { date: STATE.sessionDate, indicator: byInd, sector: sec, atr: atrBuckets, regime: reg, tod: tod, cmp: cmp, nLive: lt.length };
}
function winRate(arr) { if (!arr.length) return 0; var w = 0; for (var i = 0; i < arr.length; i++) if (arr[i].pnl > 0) w++; return w / arr.length; }
function avgRet(arr) { if (!arr.length) return 0; var s = 0; for (var i = 0; i < arr.length; i++) s += arr[i].retPct; return s / arr.length; }

function marginVsSpy() {
  var b = lsGet(LS_BENCH, { value: BASE_CAP });
  var combined = (STATE.capitalA + STATE.capitalB) / 2;
  return combined - b.value;
}

/* attempt a gated weight change for one side; returns audit record */
function attemptAdaptation(side, learn) {
  var lt = liveTrades().filter(function (t) { return sideOf(t) === side && t.sub; });
  if (lt.length < 30) return { side: side, status: "insufficient", note: lt.length + "/30 live trades", date: STATE.sessionDate };

  var cut = Math.floor(lt.length * 0.7);
  var train = lt.slice(0, cut), hold = lt.slice(cut);
  if (hold.length < 5) return { side: side, status: "insufficient", note: "holdout too small", date: STATE.sessionDate };

  /* indicator with strongest winner/loser separation on TRAINING */
  var best = null;
  for (var k = 0; k < INDS.length; k++) {
    var sep = meanSub(train, INDS[k], true) - meanSub(train, INDS[k], false);
    if (best === null || Math.abs(sep) > Math.abs(best.sep)) best = { ind: INDS[k], sep: sep };
  }
  var dir = best.sep >= 0 ? 1 : -1;

  /* out-of-sample: separation must hold (same sign) on holdout */
  var holdSep = meanSub(hold, best.ind, true) - meanSub(hold, best.ind, false);
  var oosPass = (holdSep >= 0 ? 1 : -1) === dir && Math.abs(holdSep) > 0.005;

  /* benchmark gate (proxy): on holdout, weighting this indicator more must
     correlate with better realised returns, AND the sim must currently be at
     or ahead of SPY. A full re-simulation is out of scope, so this is a
     conservative proxy and is labelled as such in the audit. */
  var xs = [], ys = [];
  for (var i = 0; i < hold.length; i++) { xs.push(hold[i].sub[best.ind]); ys.push(hold[i].retPct); }
  var c = corr(xs, ys);
  var benchPass = ((c >= 0 ? 1 : -1) === dir) && (marginVsSpy() >= 0);

  var from = learn.weights[side][best.ind];
  var raw = {};
  for (var w = 0; w < INDS.length; w++) raw[INDS[w]] = learn.weights[side][INDS[w]];
  raw[best.ind] = from + dir * 0.03;
  /* clamp + renormalise the five active weights to sum 1.0 (news stays 0) */
  for (var c2 = 0; c2 < INDS.length; c2++) { if (raw[INDS[c2]] < 0.05) raw[INDS[c2]] = 0.05; if (raw[INDS[c2]] > 0.40) raw[INDS[c2]] = 0.40; }
  var sum = 0; for (var s = 0; s < INDS.length; s++) sum += raw[INDS[s]];
  for (var nrm = 0; nrm < INDS.length; nrm++) raw[INDS[nrm]] = raw[INDS[nrm]] / sum;
  var to = raw[best.ind];

  var applied = oosPass && benchPass;
  if (applied) { for (var ap = 0; ap < INDS.length; ap++) learn.weights[side][INDS[ap]] = round3(raw[INDS[ap]]); }

  return {
    side: side, indicator: best.ind, dir: dir > 0 ? "up" : "down",
    trainSep: round3(best.sep), holdSep: round3(holdSep), oosPass: oosPass,
    benchCorr: round3(c), margin: round2(marginVsSpy()), benchPass: benchPass,
    from: round3(from), to: round3(to), applied: applied, nTrades: lt.length,
    status: applied ? "applied" : "rejected",
    note: applied ? "passed OOS + benchmark gates" : (!oosPass ? "failed out-of-sample" : "failed benchmark gate"),
    date: STATE.sessionDate
  };
}
function round2(x) { return Math.round(x * 100) / 100; }
function round3(x) { return Math.round(x * 1000) / 1000; }

function runLearning() {
  var learn = lsGet(LS_LEARN, null);
  if (!learn) {
    learn = {
      weights: { long: clone(WEIGHTS_A), short: clone(WEIGHTS_B) },
      original: { long: clone(WEIGHTS_A), short: clone(WEIGHTS_B) },
      sectorMult: {}, analyses: [], adaptations: [], lastAnalysisDate: null
    };
  }
  /* analysis runs daily; changes are gated */
  var an = computeAnalysis();
  learn.analyses.unshift(an);
  if (learn.analyses.length > 60) learn.analyses = learn.analyses.slice(0, 60);
  learn.lastAnalysisDate = STATE.sessionDate;

  var nSessLive = STATE.sessions.filter(function (s) { return s.dataSource === "live"; }).length;

  /* weight reviews (>=30 trades per indicator-side) */
  var recL = attemptAdaptation("long", learn);
  var recS = attemptAdaptation("short", learn);
  if (recL.status !== "insufficient") learn.adaptations.unshift(recL);
  if (recS.status !== "insufficient") learn.adaptations.unshift(recS);

  /* sector multiplier review (>=5 live sessions), gated on margin>=0 */
  if (nSessLive >= 5 && marginVsSpy() >= 0) {
    var sec = an.sector;
    for (var s in sec) {
      if (!sec.hasOwnProperty(s) || sec[s].n < 8) continue;
      var wr = sec[s].w / sec[s].n;
      var cur = learn.sectorMult[s] || 1.0;
      var next = cur;
      if (wr > 0.55) next = Math.min(1.15, cur + 0.05);
      else if (wr < 0.45) next = Math.max(0.85, cur - 0.05);
      if (next !== cur) {
        learn.sectorMult[s] = round3(next);
        learn.adaptations.unshift({ side: "sector:" + s, status: next > cur ? "applied" : "applied", indicator: "sectorMult", from: round3(cur), to: round3(next), note: "win rate " + (wr*100).toFixed(0) + "% over " + sec[s].n + " trades", applied: true, date: STATE.sessionDate });
      }
    }
  }
  if (learn.adaptations.length > 120) learn.adaptations = learn.adaptations.slice(0, 120);
  lsSet(LS_LEARN, learn);
}
